{% extends "base.html" %}
{% block title %}Login | FixMyArea{% endblock %}
{% block content %}
<div class="auth-panel">
    <h1>Login</h1>
    <p class="text-muted">Access your civic issue dashboard.</p>
    <form method="post" class="vstack gap-3">
        <div>
            <label class="form-label">Email</label>
            <input class="form-control" type="email" name="email" required>
        </div>
        <div>
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="small mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    <p class="small text-muted mt-2">Admin: admin@fixmyarea.local / Admin@123</p>
</div>
{% endblock %}
