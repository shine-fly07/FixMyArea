{% if pages and pages > 1 %}
<nav class="mt-3">
    <ul class="pagination justify-content-end">
        {% for p in range(1, pages + 1) %}
        <li class="page-item {% if page == p %}active{% endif %}">
            <a class="page-link" href="{{ page_url(p) }}">{{ p }}</a>
        </li>
        {% endfor %}
    </ul>
</nav>
{% endif %}
